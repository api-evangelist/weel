              schema:
                $ref: '#/components/schemas/AccountingCode'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingCode'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
