name: Weel
kind: company
description: >-
  Weel (formerly DiviPay, operated by Weel Pty Ltd) is a Melbourne-based
  all-in-one spend management platform for finance teams in Australia and New
  Zealand, serving over 4,000 finance teams and 60,000+ card holders. Weel
  issues virtual and physical Visa debit cards with real-time limits and
  controls, and layers accounts payable automation, expense management,
  reimbursements, subscription management, budgets, and approval policies on
  top. Rather than operating payment rails directly, Weel sits on the spend
  and AP/AR seam, syncing approved spend into Xero, QuickBooks, MYOB, and
  NetSuite. On the API posture, Weel ships a genuine public developer portal
  at developer.letsweel.com (Redocly-based) documenting a single RESTful "Weel
  Open API" that both reads and writes budgets, users, transactions, custom
  fields, accounting codes, categories, invites, and top-ups, authenticated
  with a bearer API key generated in-app. API access is an Enterprise-tier
  capability. No public webhooks, Postman collection, or OAuth flow are
  documented as of this review.
