- aid: weel:weel-custom-fields-api
  name: Weel Custom Fields API
  description: >-
    This group of endpoints allows you to create and manage custom fields (dimensions/cost centres) for
    your business.


    Custom fields can be of type `LIST` (with predefined options) or `FREE_TEXT`. Custom fields created
    via the Public API have a `created_by` value of `PUBLIC_API`.


    Custom fields created by accounting integrations (Xero, MYOB, QuickBooks, NetSuite, Business Central)
    have restrictions: their name and type cannot be modified via the Public API.
