- aid: weel:weel-accounting-codes-api
  name: Weel Accounting Codes API
  description: >-
    This group of endpoints allows you to manage GL codes (accounting codes) for your business.


    GL codes are used to classify expenses for bookkeeping export. Businesses with a connected accounting
    integration (Xero, MYOB, NetSuite, QuickBooks, Business Central) cannot create or delete GL codes
    via the API — those are managed by the integration sync. Businesses with a manual integration or no
    integration can freely create, update, and delete GL codes. A manual integration is automatically
    created on the first POST if none exists.
  humanURL: https://developer.letsweel.com/openapi
  baseURL: https://public.letsweel.com
