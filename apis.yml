- aid: weel:weel-budgets-api
  name: Weel Budgets API
  description: >-
    This group of endpoints allows you to retrieve and manage budget data, including listing budgets and
    fetching individual budget details.


    Budgets are organised in a hierarchy where a budget can have multiple members. Each member is associated
    with a user. Funds can be allocated at the budget level or at the member level, using the flag `has_member_limits`.


    ![Budget Hierachy](assets/budget-hierarchy.png)
  humanURL: https://developer.letsweel.com/openapi
  baseURL: https://public.letsweel.com
