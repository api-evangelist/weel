apis:
- aid: weel:weel-open-api
  name: Weel Open API
  description: >-
    The Weel Open API is a single RESTful interface that programmatically reads
    and writes a business's spend data in Weel — budgets, budget members,
    budget owners, budget top-ups, users, roles, transactions, statements,
    invites, categories, tax rates, accounting codes, and custom fields — to
    automate expense workflows and build custom integrations. OpenAPI 3.1.0,
    30 documented operations across 15 resource tags, authenticated with a
    bearer API key. API access is available on the Enterprise plan.
  humanURL: https://developer.letsweel.com/openapi
  baseURL: https://public.letsweel.com
