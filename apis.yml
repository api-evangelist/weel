- aid: weel:weel-budget-topups-api
  name: Weel Budget Topups API
  description: >-
    This group of endpoints allows you to retrieve and create budget topups. Topups are used to increase
    or decrease the available amount of a budget or budget member.


    Topups will be automatically approved, unless a Workflow or Policy has been configured in Weel for
    that requires approval for budget topups.


    There are two types of topups:
      - Budget topups are used to increase or decrease the available amount of a budget. This is only
    permitted when `has_member_limits` is `false` for the budget.
      - Budget member topups are used to increase or decrease the available amount of a budget member.
    This is only permitted when `has_member_limits` is `true` for the budget.

    `has_member_limits` is set to `true` when this toggle is enabled in the budget creation form.
      ![Has Member Limits is true](assets/has-member-limits-true.png)
  humanURL: https://developer.letsweel.com/openapi
  baseURL: https://public.letsweel.com
