generated: '2026-07-24'
method: searched
source: >-
  https://developer.letsweel.com/getting-started/authentication,
  https://developer.letsweel.com/getting-started/pagination,
  openapi/weel-openapi.yml
authentication:
  style: HTTP bearer API key
  header: 'Authorization: Bearer <token>'
  ref: authentication/weel-authentication.yml
base_url: https://public.letsweel.com
versioning:
  scheme: uri-path
  versions: [v1, v2]
  note: >-
    Most resources are served under /v1/businesses/{client_id}/...; transactions
    are served under /v2/businesses/{client_id}/transactions. No version header
    or dated-version scheme is documented.
pagination:
  style: offset
  params:
    - name: offset
      in: query
      default: 0
      description: Number of items to skip.
    - name: limit
      in: query
      default: 50
      maximum: 500
      description: Number of items to return.
  response_envelope:
    count: Total number of items available.
    next: Query string for the subsequent page (e.g. "limit=50&offset=100").
    previous: Query string for the prior page.
    results: Array of the requested items.
  docs: https://developer.letsweel.com/getting-started/pagination
scoping:
  tenant: >-
    Every resource path is scoped to a business via the {client_id} path
    parameter (/v1/businesses/{client_id}/...). The API key resolves the caller's
    business.
idempotency:
  supported: false
  note: >-
    No Idempotency-Key header or parameter is documented or present in the
    OpenAPI. Retrying non-idempotent writes (POST create endpoints) is not
    protected by an idempotency contract.
request_tracing:
  supported: false
  note: No documented request-id / correlation header.
field_expansion:
  supported: false
metadata:
  supported: false
error_envelope:
  shape: bare
  note: >-
    Error responses return an HTTP status code with a short description
    (Bad Request / Unauthorized / Forbidden / Not Found / Too Many Requests /
    Service Unavailable); no application/problem+json body schema is defined.
  ref: errors/weel-problem-types.yml
rate_limiting:
  signaled: partial
  note: >-
    A 429 Too Many Requests response is declared on at least one write operation,
    but no rate-limit numbers or RateLimit-* headers are documented.
